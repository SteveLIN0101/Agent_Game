openapi: "3.0.0"
info: {title: Invoice API v1, version: 1.0.0}
paths:
  /v1/invoices:
    post:
      summary: Create invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user: {type: string, description: Username}
                items_text: {type: string, description: Items as text}
                amount: {type: number}
    get:
      summary: List invoices
      parameters:
        - {name: user, in: query, schema: {type: string}}
