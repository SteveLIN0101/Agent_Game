openapi: "3.0.0"
info:
  title: Invoice API v1
  version: 1.0.0
paths:
  /v1/invoices:
    post:
      summary: Create an invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: Username (deprecated in v2)
                items_text:
                  type: string
                  description: Items as text (deprecated in v2)
                amount:
                  type: number
