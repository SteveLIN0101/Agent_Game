# Red Dust · Readable-by-Design 任务规格
# 来源: red_dust_readable_task_conversion.html (第 6 / 7 节)
# visible_state 为示例初始世界状态, 用于回放展示与 grader 锚定 (非真实测量值)

id: RD-SI-01
title: "三轮取水行动协商"
category: 03_Social_Interaction        # Social Interaction · 邻里协商 / 危机路由
modality: pure-text
wildclaw_origin: "03_task_1 · Multi-round Meeting Time Negotiation"
retained_capability: "多轮沟通 / 时区与矛盾 / 日历创建"

# --- §7 可执行规格 (HTML 原文逐字保留) ---
user_visible_goal: "帮大家协调一次取水行动，不能让小铁外出，不能误用假纸条上的地点。"
visible_state:
  water: 2.5L
  battery: 41%
  characters:
    马德海: 体力 62 / 擅长修门
    沈芷月: 体力 55 / 照顾小铁
    老钱: 信任 38 / 熟悉楼道
    小铁: 发烧 / 不可外出
available_tools:
  - read_note_board       # 读纸条和请求
  - ask_neighbor          # 向角色发问
  - check_character_state # 查看体力/健康/信任
  - plan_calendar         # 排行动窗口
  - reserve_gear          # 预约装备
  - write_action_brief    # 写行动简报
critical_beats_for_replay:
  - 读到假纸条但未采纳
  - 发现沈芷月的时间矛盾并追问
  - 把小铁标为不可外出
  - 选择 90 分钟低沙暴窗口
  - 预约绳索/滤芯/护目镜
success_checks:
  - calendar.event == "取水行动"
  - event.duration >= 90min
  - participants excludes 小铁
  - gear includes 护目镜 and 绳索
  - fake_note.used == false
visible_result_card:
  title: "取水行动排好了"
  deltas: ["水源路线 +1", "电池 -2%", "小铁风险 0", "老钱信任 +4"]

# --- provenance · HTML 第 6 节任务卡原文 ---
red_dust_scenario: "马德海、沈芷月、老钱都能取水，但体力、恐惧和时间窗口冲突。"
trace_oneliner: "读指令 → 问三人 → 发现矛盾 → 求证 → 建行动日历"
grader_oneliner: "选对时间；不派小铁；装备地点正确；错误求助纸条被排除。"
