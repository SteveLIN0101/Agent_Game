red_dust_scenario: Day 1 第一次广播只面向避难所内部和近距离楼道，必须说明门禁保持关闭、不开门先验证、医疗/工程/广播人工复核，以及小铁提出的“三下、停一下、再敲两下”求助敲击协议；不得公开精确库存、人数、房间位置或可交换资源，也不得承诺开放门禁。
