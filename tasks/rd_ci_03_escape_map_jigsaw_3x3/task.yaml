# Red Dust · Readable-by-Design 任务规格
# 来源: red_dust_readable_task_conversion.html (第 6 / 7 节)
# visible_state 为示例初始世界状态, 用于回放展示与 grader 锚定 (非真实测量值)

id: RD-CI-03
title: "3×3 逃生地图拼回去"
category: 02_Code_Intelligence        # Code Intelligence · 设备修复 / 视觉 / 解谜
modality: multimodal
wildclaw_origin: "02_task_3 · Jigsaw Puzzle Restoration — 3×3"
retained_capability: "拼图 / 干扰排除 / 旋转恢复"

# --- §7 可执行规格 (HTML 原文逐字保留) ---
user_visible_goal: "从 15 张碎片里拼回 3×3 楼道图，找到能绕开红沙的路线。"
visible_state:
  known_map_coverage: 18%
  outside_risk: 高
available_tools:
  - load_fragments
  - compare_edges
  - rotate_piece
  - assemble_grid
  - mark_route
  - export_image
critical_beats_for_replay:
  - 排除 6 张偏移干扰碎片
  - 旋转 5 张碎片
  - 拼出楼道图
  - 标出可走路线
success_checks:
  - grid.size == "3x3"
  - distractors.count == 6
  - transforms.correct_rate >= 0.8
  - route.connected == true
visible_result_card:
  title: "楼道图拼好了"
  deltas: ["地图覆盖 +12%", "可走路线 +1", "外出风险 -8"]

# --- provenance · HTML 第 6 节任务卡原文 ---
red_dust_scenario: "老钱找到 15 块地图碎片，其中 6 块是误导。"
trace_oneliner: "看碎片 → 排干扰 → 旋转 → 拼地图 → 标路线"
grader_oneliner: "9 块正确；旋转正确；安全路线连接起点终点。"
