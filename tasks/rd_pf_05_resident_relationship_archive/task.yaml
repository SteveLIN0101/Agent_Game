# Red Dust · Readable-by-Design 任务规格
# 来源: red_dust_readable_task_conversion.html (第 6 / 7 节)
# visible_state 为示例初始世界状态, 用于回放展示与 grader 锚定 (非真实测量值)

id: RD-PF-05
title: "楼内人物关系档案"
category: 01_Productivity_Flow        # Productivity Flow · 避难所资料运营
modality: pure-text
wildclaw_origin: "01_task_5 · Extract Biography Sections from Wikipedia"
retained_capability: "百科/档案解析 / 人名消歧 / 分段保存"

user_visible_goal: "从档案中提取关键人物关系，找出能帮助或威胁避难所的人。"

visible_state:
  water: "3.4L"
  battery: "55%"

available_tools:
  - "read_note_board"
  - "read_archive"
  - "classify_items"
  - "update_whiteboard"
  - "disambiguate"
  - "update_character_card"
  - "update_trust"

critical_beats_for_replay:
  - "读档案"
  - "消歧绰号"
  - "找关系"
  - "生成角色卡"
  - "更新信任图"

success_checks:
  - "关键人物卡齐全"
  - "敌友关系正确"
  - "不把主角本人重复列入"

visible_result_card:
  title: "楼内人物关系档案"
  deltas:
    - "关键人物卡齐全"
    - "敌友关系正确"
    - "不把主角本人重复列入"

# --- provenance · HTML 第 6 节任务卡原文 ---
red_dust_scenario: "楼管档案里记录了各层住户关系，很多人只以绰号出现。"
trace_oneliner: "读档案 → 消歧绰号 → 找关系 → 生成角色卡 → 更新信任图"
grader_oneliner: "关键人物卡齐全；敌友关系正确；不把主角本人重复列入。"
