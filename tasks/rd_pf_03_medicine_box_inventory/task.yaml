red_dust_scenario: 这道药箱题会在 Day 1 公开台账、Day 3 小铁复诊/药箱分级、Day 10 医疗预检和 Day 11 最终封存中复用。AURA 要识别公共医疗箱与私人物资里的药名、剂量、禁忌和有效期，标注来源与沈芷月复核点；它只能隔离危险药，不能把药物或病人当成可直接调度的资源。
