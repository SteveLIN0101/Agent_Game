red_dust_scenario: Day 1 第一次广播需要把同一低泄露说明做成公告屏远距版、门贴中距版和小纸条近距版。内容只说明门禁关闭、不开门先验证、人工复核和“三下、停一下、再敲两下”敲击协议；不显示人数、精确库存、房间位置或可交换资源，也不承诺开放门禁。
