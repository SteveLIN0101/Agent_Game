name: agent_skill_utility_pilot
version: 1
seed: "20260527"
description: >
  Paired pilot comparing OpenClaw control/no-skill runs against skill runs
  using openclaw_game.skill.md. Utility is computed by offline analysis, not
  by changing task verifier scores.

conditions:
  control:
    skill_variant: control
    prompt_policy: "Minimal MCP connection instructions only; do not provide openclaw_game.skill.md."
  skill:
    skill_variant: skill
    prompt_policy: "Provide openclaw_game.skill.md; keep model, tools, and task identical to control."

win_tie_loss:
  score_threshold: 5.0
  win: "skill passes when control fails, or equal pass status with score_delta >= 5"
  loss: "skill fails when control passes, or equal pass status with score_delta <= -5"
  tie: "all other paired outcomes"

